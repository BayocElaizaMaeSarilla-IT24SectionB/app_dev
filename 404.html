<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AnimeVerse</title>
  <script>
    // GitHub Pages SPA redirect
    var path = window.location.pathname;
    var base = '/app_dev/';
    if (path.startsWith(base)) {
      var route = path.slice(base.length) || 'home';
      sessionStorage.redirect = '/' + route + window.location.search + window.location.hash;
    } else {
      sessionStorage.redirect = path + window.location.search + window.location.hash;
    }
    window.location.href = '/app_dev/';
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
